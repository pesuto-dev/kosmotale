name: Deploy demo

# Manual only: nothing deploys on merge or push. Run this from Actions
# after Ben has set the SFTP secrets and given an explicit go-ahead.
on:
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build static export for /kosmotale
        run: npm ci && npm run build && npm run check:export
        env:
          NEXT_PUBLIC_BASE_PATH: /kosmotale
          NEXT_PUBLIC_NOINDEX: "1"
      - name: Upload to pesuto.dev/kosmotale/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_DEV_HOST }}
          username: ${{ secrets.SFTP_DEV_USERNAME }}
          key: ${{ secrets.SFTP_KEY }}
          port: 22
          # out/ prefix is stripped so files land in the kosmotale subfolder,
          # not in the site root. rm stays false: never delete the web root.
          # overwrite applies only under this target subdirectory.
          source: "out/"
          strip_components: 1
          target: ${{ secrets.SFTP_REMOTE_PATH }}/kosmotale
          overwrite: true
          rm: false
